apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ecommerce-ui-scaler
spec:
  scaleTargetRef:
    name: ecommerce-ui
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 30
  triggers:
  - type: cpu
    metricType: Utilization
    metadata:
      value: "70"
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.istio-system.svc.cluster.local:9090
      metricName: http_requests_total
      query: sum(rate(http_requests_total{app="ecommerce-ui"}[1m])) by (app)
      threshold: "100"
  - type: memory
    metricType: Utilization
    metadata:
      value: "80"
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.istio-system.svc.cluster.local:9090
      metricName: api-latency
      threshold: "500"
      query: |
        histogram_quantile(
          0.95,
          sum(
            rate(
              istio_request_duration_milliseconds_bucket{
                destination_workload="profile-management"
              }[2m]
            )
          ) by (le)
        )
  - type: prometheus
    metadata:
      metricName: request-rate
      serverAddress: http://prometheus.istio-system.svc.cluster.local:9090
      threshold: "50"
      query: |
        sum(rate(istio_requests_total{
          destination_workload="profile-management"
        }[2m]))


