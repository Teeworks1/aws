apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-sa
  namespace: default
  labels:
    app: aws-sa
  annotations:
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/eks-sa-role
    kubernetes.io/service-account.name: aws-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role  
metadata:
  name: aws-sa-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-sa-rolebinding
  namespace: default  
subjects:
- kind: ServiceAccount
  name: aws-sa
  namespace: default
roleRef:
  kind: Role
  name: aws-sa-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-sa-secret
  namespace: default
  annotations:
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/eks-sa-role
    kubernetes.io/service-account.name: aws-sa
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Pod
metadata:
  name: aws-sa-pod
  namespace: default
spec:
  serviceAccountName: aws-sa
  automountServiceAccountToken: true
  containers:
  - name: aws-sa-container
    image: amazonlinux:latest
    command: ["/bin/sh", "-c", "sleep 3600"]
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: aws-sa-service
  namespace: default
spec:
  selector:
    app: aws-sa
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80


# kubectl auth can-i get pods --as=system:serviceaccount:default:aws-sa